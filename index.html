<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kamus7 - Juegos Completados en Stream</title>
<style>
body{
margin:0;
background:radial-gradient(circle at top,#1b0638,#080312 70%);
font-family:Segoe UI,Tahoma,sans-serif;
color:#fff;
}
.container{max-width:1300px;margin:auto;padding:20px;}
.header{
border:2px solid #8a3cff;
border-radius:20px;
padding:25px;
text-align:center;
background:rgba(15,10,35,.85);
box-shadow:0 0 25px rgba(138,60,255,.4);
}
.logo{
font-size:72px;
font-weight:900;
letter-spacing:4px;
color:#fff;
text-shadow:0 0 20px #a855f7,0 0 40px #7c3aed;
}
.subtitle{
font-size:26px;
font-weight:700;
}
.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:15px;
margin:20px 0;
}
.card{
background:#12091f;
border:1px solid #7c3aed;
border-radius:16px;
padding:18px;
box-shadow:0 0 15px rgba(124,58,237,.2);
}
.card h3{margin:0;font-size:14px;color:#ccc;}
.big{font-size:42px;font-weight:bold;color:#c084fc;}
.progress{
height:18px;background:#25113f;border-radius:20px;overflow:hidden;
}
.progress-bar{
height:100%;width:76%;background:linear-gradient(90deg,#a855f7,#d8b4fe);
}
.controls{
display:grid;
grid-template-columns:2fr 1fr 1fr;
gap:15px;
margin-bottom:15px;
}
input,select{
background:#12091f;
color:white;
border:1px solid #7c3aed;
padding:12px;
border-radius:12px;
}
.tablewrap{
border:1px solid #7c3aed;
border-radius:16px;
overflow:hidden;
background:#0d0718;
}
table{width:100%;border-collapse:collapse;}
th{
background:#6d28d9;
padding:14px;
text-align:left;
}
td{
padding:10px 14px;
border-bottom:1px solid #24113d;
}
tr:hover{background:#1a1030;}
.footer{
text-align:center;
margin-top:20px;
color:#d8b4fe;
}
@media(max-width:800px){
.controls{grid-template-columns:1fr;}
.logo{font-size:46px;}
}
</style>
</head>
<body>
<div class="container">

<div class="header">
<div class="logo">🎮 KAMUS7</div>
<div class="subtitle">Juegos Completados en Stream</div>
</div>

<div class="cards">
<div class="card">
<h3>TOTAL COMPLETADOS</h3>
<div class="big" id="totalGames"></div>
</div>

<div class="card">
<h3>PLATAFORMAS</h3>
<div class="big" id="platforms"></div>
</div>

<div class="card">
<h3>ÚLTIMO JUEGO</h3>
<div id="lastGame" style="font-size:22px;font-weight:bold"></div>
</div>

<div class="card">
<h3>OBJETIVO ANUAL</h3>
<div class="big">50</div>
</div>

<div class="card">
<h3>PROGRESO</h3>
<div class="progress"><div class="progress-bar"></div></div>
<div style="margin-top:8px">42 / 50</div>
</div>
</div>

<div class="controls">
<input type="text" id="search" placeholder="🔎 Buscar juego o plataforma...">
<select id="platformFilter">
<option value="">Mostrar: Todos</option>
</select>
<select id="sort">
<option value="az">Ordenar: Nombre (A-Z)</option>
<option value="za">Ordenar: Nombre (Z-A)</option>
</select>
</div>

<div class="tablewrap">
<table>
<thead>
<tr>
<th>#</th>
<th>Juego</th>
<th>Plataforma</th>
</tr>
</thead>
<tbody id="gamesBody"></tbody>
</table>
</div>

<div class="footer">
💜 ¡Gracias por acompañarme en cada aventura!<br>
Seguimos sumando más historias.
</div>

</div>

<script>
const games=[
["Pokemon Edicion Rojo Fuego","GBA"],
["Mortal Kombat 1","Sega Genesis"],
["Mortal Kombat 2","Sega Genesis"],
["Ultimate Mortal Kombat 3","Sega Genesis"],
["Killer Instinct","SNES"],
["Killer Instinct","Arcade"],
["Dancing Eyes","Arcade"],
["World Rally Championship Gaelco","Arcade"],
["Gunstar Heroes","Sega Genesis"],
["Mc Donalds Treasure Land","Sega Genesis"],
["Marvel vs Capcom","Arcade"],
["King of Fighters 96","Arcade"],
["King of Fighters 97","Arcade"],
["King of Fighters 2002","Arcade"],
["King of Fighters XIV","PC"],
["Street Fighter 2","Arcade"],
["Bloody Roar 1","PSX"],
["Power Rangers The Movie","Sega Genesis"],
["Mighty Morphin Power Rangers","Sega Genesis"],
["Sonic Mania","PC"],
["Tumblepop","Arcade"],
["Adventure Island 2","NES/Family Game"],
["Fatal Fury 2","Sega Genesis"],
["Sonic 1","Sega Genesis"],
["Bishoujo Senshi Sailor Moon","Sega Genesis"],
["Bloody Roar 2","PSX"],
["Street Fighter Alpha EX Plus","PSX"],
["The Flintstones: Rescue of Dino & Hoppy","NES/Family Game"],
["Sonic 3","Sega Genesis"],
["Adventure Island 3","NES/Family Game"],
["Chip & Dale Rescue Rangers","NES/Family Game"],
["Chip & Dale 2","NES/Family Game"],
["Adventure Island 1","NES/Family Game"],
["Felix the Cat","NES/Family Game"],
["Sonic & Knuckles","Sega Genesis"],
["Sonic 3D Blast","Sega Genesis"],
["Tiny Toon Adventures","NES/Family Game"],
["Tiny Toon Adventures","Sega Genesis"],
["Super Mario World","SNES"],
["64th:A Detective Story","Arcade"],
["Jackie Chan","NES"],
["Tu vieja en tanga","Steam"]
];

document.getElementById("totalGames").textContent=games.length;
document.getElementById("lastGame").textContent=games[games.length-1][0];

const platforms=[...new Set(games.map(g=>g[1]))];
document.getElementById("platforms").textContent=platforms.length;

const pf=document.getElementById("platformFilter");
platforms.sort().forEach(p=>{
let o=document.createElement("option");
o.value=p;o.textContent=p;
pf.appendChild(o);
});

function render(){
let data=[...games];

const search=document.getElementById("search").value.toLowerCase();
const filter=pf.value;
const sort=document.getElementById("sort").value;

data=data.filter(g=>
(g[0].toLowerCase().includes(search)||g[1].toLowerCase().includes(search))
&&(!filter||g[1]===filter)
);

data.sort((a,b)=>sort==="az"?a[0].localeCompare(b[0]):b[0].localeCompare(a[0]));

gamesBody.innerHTML=data.map((g,i)=>`
<tr>
<td>${i+1}</td>
<td>✅ ${g[0]}</td>
<td>${g[1]}</td>
</tr>`).join("");
}

search.oninput=render;
platformFilter.onchange=render;
sort.onchange=render;
render();
</script>
</body>
</html>
